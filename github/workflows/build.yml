name: Build Extensions

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # Daily rebuild at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Gradle execute permission
        run: chmod +x gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build all APKs
        run: ./gradlew assembleRelease --parallel --no-daemon
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}

      - name: Collect APKs
        run: |
          mkdir -p repo/apk
          find . -name "*.apk" -not -path "*/intermediates/*" | while read apk; do
            cp "$apk" repo/apk/
          done
          echo "Collected APKs:"
          ls repo/apk/

      - name: Copy index files
        run: |
          cp index.min.json repo/
          cp index.json repo/ 2>/dev/null || true

      - name: Generate repo index with APK hashes
        run: |
          python3 .github/scripts/generate_index.py repo/apk repo/index.min.json

      - name: Upload APKs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: extension-apks
          path: repo/apk/*.apk
          retention-days: 30

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./repo
          force_orphan: true
          commit_message: "Auto-deploy: ${{ github.sha }}"

      - name: Create GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "r${{ github.run_number }}"
          name: "Build ${{ github.run_number }}"
          body: |
            Automated build from commit ${{ github.sha }}
            
            Add to Mihon:
            `https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/index.min.json`
          files: repo/apk/*.apk
          token: ${{ secrets.GITHUB_TOKEN }}

  setup-gradle:
    name: Ensure Gradle Wrapper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/wrapper-validation-action@v2
        continue-on-error: true
