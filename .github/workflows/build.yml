name: Build Extensions

on:
  push:
    branches: [ main, master ]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle 8.5
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip -O gradle.zip
          unzip -q gradle.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.5/bin" >> $GITHUB_PATH

      - name: Build all APKs
        run: |
          gradle assembleRelease \
            --parallel \
            --no-daemon \
            --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx3g"

      - name: Collect APKs
        run: |
          mkdir -p repo/apk
          find . -name "*.apk" \
            -not -path "*/intermediates/*" \
            -exec cp {} repo/apk/ \;

          echo "APKs collected:"
          ls -la repo/apk/

      - name: Prepare index
        run: |
          sed 's/"apk":"/"apk":"apk\//g' index.min.json > repo/index.min.json

      - name: Create repo.json
        run: |
          cat <<EOF > repo/repo.json
          {
            "name": "AfanJurl Mihon Repo",
            "website": "https://github.com/AfanJurl/mihon-full-repo",
            "description": "Mihon extension repository"
          }
          EOF

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./repo
          publish_branch: repo
          force_orphan: true
