name: Build Extensions

on:
  push:
    branches: [ main, master ]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle 8.5
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip -O gradle.zip
          unzip -q gradle.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.5/bin" >> $GITHUB_PATH

      - name: Build all APKs
        run: |
          gradle assembleRelease \
            --parallel \
            --no-daemon \
            --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx3g"

      - name: Collect APKs
        if: success()
        run: |
          mkdir -p repo/apk
          find . -name "*.apk" \
            -not -path "*/intermediates/*" \
            -exec cp {} repo/apk/ \;
          ls -la repo/apk/

      - name: Update index with base URL
        if: success()
        run: |
          sed -i 's/"apk":"\([^"]*\)"/"apk":"https:\/\/raw.githubusercontent.com\/AfanJurl\/mihon-full-repo\/repo\/apk\/\1"/g' index.min.json
          cp index.min.json repo/

      - name: Deploy to GitHub Pages
        if: success()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./repo
          force_orphan: true
